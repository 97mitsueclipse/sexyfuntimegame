<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sexy Fun Time Game</title>
  <style>
    :root {
      --red: #ff4d4d;
      --dark: #1a1a1a;
      --gray: #2d2d2d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: var(--dark);
      color: #f0f0f0;
      text-align: center;
      overflow: hidden;
      height: 100vh;
    }

    .screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.4s ease;
    }

    .screen.active {
      display: flex;
      opacity: 1;
    }

    /* Home Screen */
    #home-screen {
      background: linear-gradient(135deg, #1a1a1a, #330000);
    }

    #home-screen h1 {
      font-size: 3.8em;
      color: var(--red);
      margin-bottom: 20px;
      text-shadow: 0 0 30px rgba(255, 77, 77, 0.6);
    }

    #home-screen p {
      font-size: 1.5em;
      max-width: 600px;
      margin-bottom: 60px;
      opacity: 0.9;
    }

    .btn {
      padding: 18px 60px;
      font-size: 1.8em;
      background: var(--red);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(255, 77, 77, 0.4);
    }

    .btn:hover {
      background: #ff3333;
      transform: scale(1.08);
      box-shadow: 0 15px 40px rgba(255, 77, 77, 0.6);
    }

    /* Setup Screen */
    #setup-screen {
      background: var(--dark);
    }

    .setup-container {
      background: var(--gray);
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(255,77,77,0.3);
      max-width: 460px;
      width: 100%;
    }

    h2 {
      color: var(--red);
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 25px 0 10px;
      font-size: 1.4em;
      text-align: left;
    }

    .gender-options {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0 30px;
    }

    .gender-btn {
      padding: 14px 35px;
      font-size: 1.3em;
      background: #333;
      color: white;
      border: 2px solid #555;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      flex: 1;
    }

    .gender-btn.active {
      background: var(--red);
      border-color: var(--red);
      transform: scale(1.05);
    }

    /* Game Screen */
    #game-screen {
      background: var(--dark);
    }

    #result {
      font-size: 1.55em;
      max-width: 900px;
      margin: 40px auto;
      padding: 45px 35px;
      background: var(--gray);
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(255,77,77,0.3);
      line-height: 1.7;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(26,26,26,0.95);
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      border-bottom: 2px solid var(--red);
    }

    .menu-bar button {
      padding: 10px 25px;
      font-size: 1.1em;
      background: transparent;
      color: white;
      border: 2px solid var(--red);
      border-radius: 30px;
      cursor: pointer;
    }

    .menu-bar button:hover {
      background: var(--red);
    }
  </style>
</head>
<body>

  <!-- Top Menu Bar -->
  <div class="menu-bar">
    <button onclick="goToHome()">🏠 Home</button>
    <h2 style="margin:0; color:#ff4d4d;">Sexy Fun Time Game</h2>
    <div></div>
  </div>

  <!-- Home Screen -->
  <div id="home-screen" class="screen active">
    <h1>Sexy Fun Time</h1>
    <p>Spice up your night with wild, naughty, and unforgettable challenges.<br>Ready to play?</p>
    <button class="btn" onclick="goToSetup()">Begin</button>
  </div>

  <!-- Setup Screen -->
  <div id="setup-screen" class="screen">
    <div class="setup-container">
      <h2>Choose Players</h2>

      <label>Player 1</label>
      <div class="gender-options">
        <button class="gender-btn active" onclick="selectGender(1, 'Male', this)">Male</button>
        <button class="gender-btn" onclick="selectGender(1, 'Female', this)">Female</button>
      </div>

      <label>Player 2</label>
      <div class="gender-options">
        <button class="gender-btn active" onclick="selectGender(2, 'Female', this)">Female</button>
        <button class="gender-btn" onclick="selectGender(2, 'Male', this)">Male</button>
      </div>

      <button class="btn" onclick="startGame()" style="margin-top: 40px; width: 100%;">Start Game</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <div id="result">Click "Draw Again" to get your next sexy fate...</div>
    <button class="btn" onclick="drawScenario()" style="margin-top: 30px;">🎲 Draw Again</button>
  </div>

  <script>
    const scenarios = [
      // ←←← PASTE YOUR FULL ORIGINAL SCENARIOS ARRAY HERE ←←←
      // (All the ones from your first message: quick tasks, positions, puppy play, etc.)
      "Worship the other person's feet.",
      "Kiss their neck for two minutes straight.",
      // ... add every single scenario you had originally ...
    ];

    let player1Gender = "Male";
    let player2Gender = "Female";

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function goToHome() {
      showScreen('home-screen');
    }

    function goToSetup() {
      showScreen('setup-screen');
    }

    function selectGender(player, gender, element) {
      // Remove active from sibling buttons
      const siblings = element.parentElement.querySelectorAll('.gender-btn');
      siblings.forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      if (player === 1) player1Gender = gender;
      else player2Gender = gender;
    }

    function startGame() {
      showScreen('game-screen');
      drawScenario(); // Draw first scenario automatically
    }

    function drawScenario() {
      if (scenarios.length === 0) {
        document.getElementById('result').innerHTML = "No scenarios available!";
        return;
      }

      const randomIndex = Math.floor(Math.random() * scenarios.length);
      document.getElementById('result').innerHTML = 
        `<strong>You drew:</strong><br><br>` + scenarios[randomIndex];
    }

    // Spacebar shortcut to draw again
    document.addEventListener('keydown', function(e) {
      if (e.key === " " && document.getElementById('game-screen').classList.contains('active')) {
        e.preventDefault();
        drawScenario();
      }
    });
  </script>
</body>
</html>
